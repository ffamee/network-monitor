[project]
name = "fastapi-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.125.0",
    "geoalchemy2[shapely]>=0.18.1",
    "influxdb-client>=1.50.0",
    "minio>=7.2.20",
    "psycopg2-binary>=2.9.11",
    "pydantic-extra-types>=2.10.6",
    "pydantic-settings>=2.12.0",
    "python-slugify>=8.0.4",
    "redis>=7.1.0",
    "sqlmodel>=0.0.29",
    "tenacity>=9.1.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

[tool.ruff]
target-version = "py313"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  		# pycodestyle errors
    "W",  		# pycodestyle warnings
    "F",  		# pyflakes
    "I",  		# isort
    "B",  		# flake8-bugbear
    "C4",  		# flake8-comprehensions
    "UP",  		# pyupgrade
    "ARG001",	# unused arguments in functions
    "T201",  	# print statements are not allowed,
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
	"D100",  # docstring missing for module
	"D101",  # docstring missing for class
	"D102",  # docstring missing for function/method
	"D103",  # docstring missing for constructor
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[tool.mypy]
python_version = "3.13" # ปรับตามเวอร์ชันที่คุณใช้
strict = true           # แนะนำให้เปิด strict เพื่อบังคับ Type ให้เป๊ะ
ignore_missing_imports = true # ถ้า library ไหนไม่มี type hint ไม่ต้องด่า
exclude = ["venv", ".venv", "alembic"]
plugins = ["pydantic.mypy"]
